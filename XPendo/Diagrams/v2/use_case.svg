  <text x="310" y="100" fill="#E74C3C" font-size="9" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif" letter-spacing="1.5">EXPENSE MANAGEMENT</text>

  <ellipse cx="310" cy="144" rx="106" ry="24" fill="#1a0008" stroke="#E74C3C" stroke-width="1.8"/>
  <text x="310" y="149" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" font-family="-apple-system,sans-serif">Add expense</text>

