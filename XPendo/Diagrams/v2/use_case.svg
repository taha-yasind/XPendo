  <line x1="94" y1="355" x2="984" y2="440" stroke="#aabbcc" stroke-width="1" opacity="0.3"/>

  <!-- ══ OUT OF SCOPE BOX ══ -->
  <rect x="152" y="514" width="1088" height="100" rx="8" fill="#0a0e14"/>
  <text x="696" y="534" fill="#556677" font-size="10" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif" letter-spacing="0.5">OUT OF SCOPE</text>
  <text x="696" y="554" fill="#334455" font-size="10" text-anchor="middle" font-family="-apple-system,sans-serif">Cloud sync  ·  Bank integration  ·  User accounts / login  ·  Shared budgets  ·  Export to PDF</text>
  <text x="696" y="572" fill="#334455" font-size="10" text-anchor="middle" font-family="-apple-system,sans-serif">All data stored locally on-device only  ·  No internet connection required for any feature</text>
  <text x="696" y="590" fill="#223344" font-size="9.5" text-anchor="middle" font-family="-apple-system,sans-serif">Note: iCloud / CloudKit sync is planned as a future enhancement — not implemented in current version</text>

  <!-- LEGEND -->
  <rect x="152" y="622" width="1088" height="38" rx="7" fill="#111820"/>
  <ellipse cx="220" cy="641" rx="36" ry="12" fill="none" stroke="#aabbcc" stroke-width="1.5"/>
  <text x="264" y="645" fill="#667788" font-size="10" font-family="-apple-system,sans-serif">Core use case</text>
  <ellipse cx="400" cy="641" rx="36" ry="12" fill="none" stroke="#aabbcc" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="444" y="645" fill="#667788" font-size="10" font-family="-apple-system,sans-serif">«extends» — optional extension</text>
  <line x1="640" y1="641" x2="680" y2="641" stroke="#aabbcc" stroke-width="1" opacity="0.5"/>
  <text x="690" y="645" fill="#667788" font-size="10" font-family="-apple-system,sans-serif">Actor → Use Case association</text>
  <line x1="880" y1="641" x2="920" y2="641" stroke="#334455" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="930" y="645" fill="#667788" font-size="10" font-family="-apple-system,sans-serif">System boundary</text>

  <text x="640" y="706" fill="#1e2a35" font-size="8" text-anchor="middle" font-family="-apple-system,sans-serif">Xpendo — Use Case Diagram  ·  SwiftUI  ·  Local-first  ·  No backend  ·  No login required</text>
</svg>
