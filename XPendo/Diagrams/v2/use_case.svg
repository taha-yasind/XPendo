  <ellipse cx="1090" cy="440" rx="106" ry="24" fill="#002010" stroke="#27AE60" stroke-width="1.8"/>
  <text x="1090" y="445" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" font-family="-apple-system,sans-serif">Toggle demo mode</text>

