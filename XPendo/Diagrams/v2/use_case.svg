  <line x1="94" y1="315" x2="984" y2="152" stroke="#aabbcc" stroke-width="1" opacity="0.3"/>
  <line x1="94" y1="323" x2="984" y2="208" stroke="#aabbcc" stroke-width="1" opacity="0.3"/>
  <line x1="94" y1="331" x2="984" y2="264" stroke="#aabbcc" stroke-width="1" opacity="0.3"/>
  <line x1="94" y1="339" x2="984" y2="320" stroke="#aabbcc" stroke-width="1" opacity="0.3"/>
