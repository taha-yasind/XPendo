  <text x="696" y="82" fill="#334455" font-size="10" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif" letter-spacing="1">Xpendo iOS Application</text>

  <!-- ══ ACTOR ══ -->
  <circle cx="68" cy="330" r="24" fill="none" stroke="#aabbcc" stroke-width="2"/>
  <line x1="68" y1="354" x2="68" y2="404" stroke="#aabbcc" stroke-width="2"/>
  <line x1="40" y1="376" x2="96" y2="376" stroke="#aabbcc" stroke-width="2"/>
