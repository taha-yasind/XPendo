  <text x="640" y="54" fill="#667788" font-size="11" text-anchor="middle" font-family="-apple-system,sans-serif">User scenarios  ·  Local-first  ·  No login required  ·  No internet connection needed</text>

  <!-- SYSTEM BOUNDARY -->
