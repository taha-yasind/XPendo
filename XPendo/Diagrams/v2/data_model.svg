<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ma" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0,10 5,0 10" fill="none" stroke="#3498DB" stroke-width="1.5"/>
    </marker>
    <marker id="mb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0,10 5,0 10" fill="none" stroke="#9B59B6" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#0d0d1a"/>

  <!-- TITLE -->
  <text x="640" y="32" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif">Xpendo — Data Model</text>
  <text x="640" y="54" fill="#667788" font-size="11" text-anchor="middle" font-family="-apple-system,sans-serif">SwiftData  @Model  ·  Local Persistence  ·  All monetary values stored in TRY</text>

  <!-- ══════════ EXPENSE  x=60 y=68 w=310 h=248 ══════════ -->
  <rect x="60" y="68" width="310" height="248" rx="9" fill="#120008" stroke="#E74C3C" stroke-width="2"/>
  <rect x="60" y="68" width="310" height="50" rx="9" fill="#2a0010"/>
  <rect x="60" y="96" width="310" height="22" fill="#2a0010"/>
  <text x="215" y="91" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif">Expense</text>
  <text x="215" y="108" fill="#E74C3C" font-size="9" text-anchor="middle" font-family="-apple-system,sans-serif">@Model  ·  SwiftData</text>
  <line x1="60" y1="118" x2="370" y2="118" stroke="#E74C3C" stroke-width="0.8" opacity="0.4"/>
  <!-- fields -->
  <text x="78" y="140" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#cc6666">+</tspan> <tspan fill="#ddeeff">id</tspan><tspan fill="#556677"> : UUID</tspan></text>
  <text x="78" y="164" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#cc6666">+</tspan> <tspan fill="#ddeeff">title</tspan><tspan fill="#556677"> : String</tspan></text>
  <text x="78" y="188" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#cc6666">+</tspan> <tspan fill="#ddeeff">amount</tspan><tspan fill="#556677"> : Double</tspan><tspan fill="#3a5040" font-size="9.5">  // stored in TRY</tspan></text>
  <text x="78" y="212" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#cc6666">+</tspan> <tspan fill="#ddeeff">date</tspan><tspan fill="#556677"> : Date</tspan></text>
  <text x="78" y="236" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#cc6666">+</tspan> <tspan fill="#ddeeff">category</tspan><tspan fill="#556677"> : Category?</tspan><tspan fill="#3a5040" font-size="9.5">  // optional</tspan></text>
  <text x="78" y="260" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#cc6666">+</tspan> <tspan fill="#ddeeff">note</tspan><tspan fill="#556677"> : String?</tspan></text>
  <text x="78" y="284" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#cc6666">+</tspan> <tspan fill="#ddeeff">createdAt</tspan><tspan fill="#556677"> : Date</tspan></text>

  <!-- ══════════ CATEGORY  x=910 y=68 w=310 h=196 ══════════ -->
  <rect x="910" y="68" width="310" height="196" rx="9" fill="#001510" stroke="#00BFA5" stroke-width="2"/>
  <rect x="910" y="68" width="310" height="50" rx="9" fill="#003020"/>
  <rect x="910" y="96" width="310" height="22" fill="#003020"/>
  <text x="1065" y="91" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif">Category</text>
  <text x="1065" y="108" fill="#00BFA5" font-size="9" text-anchor="middle" font-family="-apple-system,sans-serif">@Model  ·  SwiftData  ·  8 presets seeded on first launch</text>
  <line x1="910" y1="118" x2="1220" y2="118" stroke="#00BFA5" stroke-width="0.8" opacity="0.4"/>
  <text x="928" y="140" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#55bbaa">+</tspan> <tspan fill="#ddeeff">id</tspan><tspan fill="#556677"> : UUID</tspan></text>
  <text x="928" y="164" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#55bbaa">+</tspan> <tspan fill="#ddeeff">name</tspan><tspan fill="#556677"> : String</tspan></text>
  <text x="928" y="188" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#55bbaa">+</tspan> <tspan fill="#ddeeff">icon</tspan><tspan fill="#556677"> : String</tspan><tspan fill="#3a5040" font-size="9.5">  // SF Symbol name</tspan></text>
  <text x="928" y="212" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#55bbaa">+</tspan> <tspan fill="#ddeeff">color</tspan><tspan fill="#556677"> : String</tspan><tspan fill="#3a5040" font-size="9.5">  // hex color</tspan></text>
  <text x="928" y="236" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#55bbaa">+</tspan> <tspan fill="#ddeeff">isDefault</tspan><tspan fill="#556677"> : Bool</tspan></text>

  <!-- ══════════ BUDGET  x=60 y=356 w=310 h=196 ══════════ -->
  <rect x="60" y="356" width="310" height="196" rx="9" fill="#00101a" stroke="#3498DB" stroke-width="2"/>
  <rect x="60" y="356" width="310" height="50" rx="9" fill="#001e38"/>
  <rect x="60" y="384" width="310" height="22" fill="#001e38"/>
  <text x="215" y="379" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif">Budget</text>
  <text x="215" y="396" fill="#3498DB" font-size="9" text-anchor="middle" font-family="-apple-system,sans-serif">@Model  ·  SwiftData</text>
  <line x1="60" y1="406" x2="370" y2="406" stroke="#3498DB" stroke-width="0.8" opacity="0.4"/>
  <text x="78" y="428" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#5599bb">+</tspan> <tspan fill="#ddeeff">id</tspan><tspan fill="#556677"> : UUID</tspan></text>
  <text x="78" y="452" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#5599bb">+</tspan> <tspan fill="#ddeeff">category</tspan><tspan fill="#556677"> : Category?</tspan><tspan fill="#3a5040" font-size="9.5">  // optional</tspan></text>
  <text x="78" y="476" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#5599bb">+</tspan> <tspan fill="#ddeeff">limitAmount</tspan><tspan fill="#556677"> : Double</tspan><tspan fill="#3a5040" font-size="9.5">  // stored in TRY</tspan></text>
  <text x="78" y="500" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#5599bb">+</tspan> <tspan fill="#ddeeff">month</tspan><tspan fill="#556677"> : Int</tspan></text>
  <text x="78" y="524" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#5599bb">+</tspan> <tspan fill="#ddeeff">year</tspan><tspan fill="#556677"> : Int</tspan></text>

  <!-- ══════════ APPSETTINGS  x=910 y=304 w=310 h=248 ══════════ -->
  <rect x="910" y="304" width="310" height="248" rx="9" fill="#0e001a" stroke="#9B59B6" stroke-width="2"/>
  <rect x="910" y="304" width="310" height="50" rx="9" fill="#1c0030"/>
  <rect x="910" y="332" width="310" height="22" fill="#1c0030"/>
  <text x="1065" y="327" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif">AppSettings</text>
  <text x="1065" y="344" fill="#9B59B6" font-size="9" text-anchor="middle" font-family="-apple-system,sans-serif">@Model  ·  Singleton  ·  Seeded on first launch</text>
  <line x1="910" y1="354" x2="1220" y2="354" stroke="#9B59B6" stroke-width="0.8" opacity="0.4"/>
  <text x="928" y="376" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#aa77cc">+</tspan> <tspan fill="#ddeeff">id</tspan><tspan fill="#556677"> : UUID</tspan></text>
  <text x="928" y="400" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#aa77cc">+</tspan> <tspan fill="#ddeeff">currencyCode</tspan><tspan fill="#556677"> : String</tspan><tspan fill="#3a5040" font-size="9.5">  // TRY / USD / EUR</tspan></text>
  <text x="928" y="424" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#aa77cc">+</tspan> <tspan fill="#ddeeff">preferredThemeCode</tspan><tspan fill="#556677"> : String?</tspan></text>
  <text x="928" y="448" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#aa77cc">+</tspan> <tspan fill="#ddeeff">preferredLanguageCode</tspan><tspan fill="#556677"> : String?</tspan></text>
  <text x="928" y="472" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#aa77cc">+</tspan> <tspan fill="#ddeeff">notificationsEnabled</tspan><tspan fill="#556677"> : Bool</tspan></text>
  <text x="928" y="496" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#aa77cc">+</tspan> <tspan fill="#ddeeff">dailyReminderEnabled</tspan><tspan fill="#556677"> : Bool</tspan></text>
  <text x="928" y="520" font-size="11" font-family="-apple-system,sans-serif"><tspan fill="#aa77cc">+</tspan> <tspan fill="#ddeeff">budgetWarningEnabled</tspan><tspan fill="#556677"> : Bool</tspan></text>

  <!-- ══════════ RELATIONSHIP 1: Expense → Category ══════════ -->
  <!-- From Expense right-center (370,192) to Category left-center (910,166) -->
  <line x1="370" y1="192" x2="910" y2="166" stroke="#3498DB" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#ma)"/>
  <!-- Label background -->
  <rect x="562" y="155" width="156" height="24" rx="5" fill="#001828"/>
  <text x="640" y="171" fill="#3498DB" font-size="10.5" font-weight="600" text-anchor="middle" font-family="-apple-system,sans-serif">category?  0..1  →</text>

  <!-- ══════════ RELATIONSHIP 2: Budget → Category ══════════ -->
  <!-- From Budget right-center (370,454) → turn → Category left-center (910,166) -->
  <path d="M 370 454 H 640 V 166 H 910" stroke="#9B59B6" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#mb)"/>
  <!-- Label on horizontal segment at bottom -->
  <rect x="562" y="443" width="156" height="24" rx="5" fill="#180028"/>
  <text x="640" y="459" fill="#9B59B6" font-size="10.5" font-weight="600" text-anchor="middle" font-family="-apple-system,sans-serif">category?  0..1  →</text>
  <!-- Label on vertical segment -->
  <rect x="606" y="290" width="68" height="50" rx="5" fill="#180028"/>
  <text x="640" y="312" fill="#9B59B6" font-size="9.5" text-anchor="middle" font-family="-apple-system,sans-serif">Budget</text>
  <text x="640" y="328" fill="#9B59B6" font-size="9.5" text-anchor="middle" font-family="-apple-system,sans-serif">→ Category</text>

  <!-- CENTER NOTE -->
  <text x="640" y="230" fill="#223344" font-size="11" text-anchor="middle" font-family="-apple-system,sans-serif">Optional @Relationship</text>
  <text x="640" y="248" fill="#1a2a38" font-size="10" text-anchor="middle" font-family="-apple-system,sans-serif">If category is deleted, the field becomes nil (nullify rule)</text>

  <!-- ══════════ LEGEND ══════════ -->
  <rect x="60" y="600" width="1160" height="60" rx="8" fill="#111820"/>
  <!-- Expense -->
  <rect x="90" y="618" width="14" height="14" rx="3" fill="#E74C3C"/>
  <text x="110" y="629" fill="#778899" font-size="10.5" font-family="-apple-system,sans-serif">Expense</text>
  <!-- Category -->
  <rect x="220" y="618" width="14" height="14" rx="3" fill="#00BFA5"/>
  <text x="240" y="629" fill="#778899" font-size="10.5" font-family="-apple-system,sans-serif">Category</text>
  <!-- Budget -->
  <rect x="370" y="618" width="14" height="14" rx="3" fill="#3498DB"/>
  <text x="390" y="629" fill="#778899" font-size="10.5" font-family="-apple-system,sans-serif">Budget</text>
  <!-- AppSettings -->
  <rect x="510" y="618" width="14" height="14" rx="3" fill="#9B59B6"/>
  <text x="530" y="629" fill="#778899" font-size="10.5" font-family="-apple-system,sans-serif">AppSettings</text>
  <!-- Arrow legend -->
  <line x1="690" y1="625" x2="740" y2="625" stroke="#3498DB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ma)"/>
  <text x="750" y="629" fill="#778899" font-size="10.5" font-family="-apple-system,sans-serif">Optional reference (category?)</text>

  <!-- Currency note -->
  <text x="640" y="650" fill="#334455" font-size="10" text-anchor="middle" font-family="-apple-system,sans-serif">All amounts stored in TRY · CurrencyConverter handles USD / EUR display conversion</text>
  <text x="640" y="706" fill="#1e2a35" font-size="8" text-anchor="middle" font-family="-apple-system,sans-serif">Xpendo — Data Model · SwiftData @Model · Local-first · No backend</text>
</svg>
